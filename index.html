<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Gửi Thảo 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#020111,#191970,#000);
color:white;
}

.box{

width:90%;
max-width:700px;
text-align:center;
padding:40px;
background:rgba(255,255,255,.08);
border-radius:25px;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(255,255,255,.2);

}

h1{

font-size:40px;
margin-bottom:25px;
color:#ff8ac7;

}

#text{

font-size:22px;
line-height:1.8;

white-space:pre-line;

}

button{

margin-top:30px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
background:#ff4f9d;
color:white;
cursor:pointer;
display:none;

}

button:hover{

transform:scale(1.05);

}

.heart{

position:absolute;
font-size:25px;
animation:fly 7s linear infinite;
}

@keyframes fly{

0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

</style>

</head>

<body>

<div class="box">

<h1>💖 Gửi Thảo 💖</h1>

<div id="text"></div>

<button onclick="rain()">💌 Bấm vào đây nhé Thảo</button>

</div>

<script>

const message=`Thảo ơi,

Có lẽ đây chỉ là một mã QR bình thường.

Nhưng với mình,
nó chứa tất cả những điều mình muốn nói.

Cảm ơn Thảo
vì đã xuất hiện trong cuộc sống của mình.

Mong rằng mỗi ngày của Thảo
đều thật vui vẻ,
bình an
và hạnh phúc.

Tùng chúc Thảo ngủ ngon ❤️`;

let i=0;

function typing(){

if(i<message.length){

document.getElementById("text").innerHTML+=message.charAt(i);

i++;

setTimeout(typing,45);

}else{

document.querySelector("button").style.display="inline-block";

}

}

typing();

function createHeart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*30)+"px";

h.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(createHeart,300);

function rain(){

for(let i=0;i<150;i++){

setTimeout(createHeart,i*25);

}

alert("💖 Cảm ơn Thảo đã quét chiếc QR này.\n\nTùng chúc Thảo luôn thật hạnh phúc ❤️");

}

</script>

</body>

</html>
